<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus help request</title>
<style>
:root{color-scheme:light;--bg:#edf3f8;--card:#fff;--ink:#15273d;--mute:#687b91;--line:#dce6ef;--go:#2869d6;--ok:#16856c;--bad:#b3261e;--shadow:0 18px 50px rgba(31,67,105,.1)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101a27;--card:#1a2838;--ink:#eef5fc;--mute:#a9bacd;--line:#33475e;--go:#86b4ff;--ok:#4dd0aa;--bad:#ff8585;--shadow:0 18px 50px rgba(0,0,0,.2)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--go) 10%,var(--bg)),var(--bg) 62%);color:var(--ink);font:17px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:43rem;margin:0 auto;padding:clamp(1rem,5vh,3rem) 1rem}
.request-card{padding:clamp(1.25rem,5vw,2.4rem);border:1px solid var(--line);border-radius:1.5rem;background:var(--card);box-shadow:var(--shadow)}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem}
.eyebrow{color:var(--go);font-size:.7rem;font-weight:800;letter-spacing:.13em}
.my-requests{display:inline-flex;align-items:center;gap:.3rem;color:var(--go);font-size:.85rem;font-weight:750;text-decoration:none}
.my-requests:hover{text-decoration:underline}
.hero{text-align:center}
.icon{width:4.7rem;height:4.7rem;margin:0 auto 1rem;border:3px solid var(--go);border-radius:50%;display:grid;place-items:center;color:var(--go);font-size:2rem;animation:pulse 2s ease-out infinite}
h1{font-size:clamp(1.65rem,6vw,2.15rem);letter-spacing:-.04em;line-height:1.15;margin:.2rem 0 .55rem}
p.s{color:var(--mute);margin:0 auto 1.25rem;max-width:34rem;font-size:.95rem}
label{display:block;font-size:.92rem;font-weight:750;margin:1.05rem 0 .4rem}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.cats button,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:.75rem;padding:.75rem .85rem}
.cats button{font-size:.9rem;font-weight:650;text-align:left;cursor:pointer;transition:transform .15s ease,border-color .15s ease,background .15s ease}
.cats button:hover{transform:translateY(-1px);border-color:var(--go)}
.cats button[aria-pressed=true]{border-color:var(--go);background:color-mix(in srgb,var(--go) 11%,var(--card));font-weight:800;color:var(--go)}
input,textarea{width:100%}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.8}
textarea{min-height:6rem;resize:vertical}
.hint{color:var(--mute);font-size:.85rem;font-weight:400}
#cnt{color:var(--mute);font-size:.85rem;text-align:right}
#sos,#go{width:100%;padding:.9rem 1rem;font:750 1rem system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:1px solid transparent;border-radius:.85rem;cursor:pointer;transition:transform .15s ease,filter .15s ease}
#sos{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:color-mix(in srgb,var(--bad) 32%,var(--line));color:var(--bad);margin:.65rem 0 .45rem}
#go{background:var(--go);color:#fff;margin-top:1.1rem;box-shadow:0 7px 16px color-mix(in srgb,var(--go) 23%,transparent)}
#go:hover,#sos:hover{transform:translateY(-1px);filter:brightness(1.04)}
#go:disabled,#sos:disabled{opacity:.65;cursor:wait;transform:none}
#sosNote{font-size:.78rem;margin-bottom:1rem}
:focus-visible{outline:3px solid var(--go);outline-offset:3px}
#msg{display:flex;align-items:center;justify-content:center;gap:.55rem;margin-top:.85rem;padding:.5rem .7rem;border-radius:.7rem;font-size:.9rem;font-weight:650;min-height:2.5rem;text-align:center;color:var(--mute)}
#msg[data-state="sending"]{background:color-mix(in srgb,var(--go) 8%,var(--card));color:var(--go)}
#msg[data-state="error"]{background:color-mix(in srgb,var(--bad) 8%,var(--card));color:var(--bad)}
#msg[data-state="success"]{background:color-mix(in srgb,var(--ok) 8%,var(--card));color:var(--ok)}
.spinner{display:none;width:1rem;height:1rem;flex:none;border:2px solid color-mix(in srgb,var(--go) 28%,transparent);border-top-color:var(--go);border-radius:50%;animation:spin .8s linear infinite}
#msg[data-state="sending"] .spinner{display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--go) 30%,transparent)}70%{box-shadow:0 0 0 .85rem transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:390px){.topline{align-items:flex-start;gap:.6rem;flex-direction:column}.cats{gap:.4rem}.cats button{padding:.68rem .55rem;font-size:.83rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section class="request-card">
<div class="topline">
  <span class="eyebrow">OUTAGE MESH · SEND HELP</span>
  <a class="my-requests" href="/requests">My requests <span aria-hidden="true">→</span></a>
</div>
<div class="hero">
<div class="icon" aria-hidden="true">♥</div>
<h1>Send a help request</h1>
<p class="s">No app needed. Sending measures how far this phone is from the help-point Wio over Wi‑Fi, then radios the request.</p>
</div>
<button id="sos" type="button">SOS</button>
<p class="s" id="sosNote">SOS is always high priority and alerts responders with sound and voice.</p>
<label>What is the situation?</label>
<div class="cats" id="cats">
{% for k,v in cats.items() %}<button type="button" data-c="{{k}}" aria-pressed="{{ 'true' if k=='MED' else 'false' }}">{{v}}</button>{% endfor %}
</div>
<label for="room">Room <span class="hint">(optional — e.g. N151, S110)</span></label>
<input id="room" maxlength="5" placeholder="Leave blank = Help Desk / this floor" autocomplete="off">
<label for="text">Details</label>
<textarea id="text" maxlength="60" placeholder="Example: need fridge for insulin"></textarea>
<div id="cnt">0 / 60</div>
<button id="go" type="button">Send request</button>
<div id="msg" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="msgText"></span></div>
</section>
</main>
<script>
let cat="MED";
const $=id=>document.getElementById(id);
function clientId(){
  let id=localStorage.getItem("om_client");
  if(!id){
    id=(crypto.randomUUID&&crypto.randomUUID())||("c"+Date.now()+"_"+Math.random().toString(16).slice(2));
    localStorage.setItem("om_client",id);
  }
  return id;
}
function rememberId(msgId){
  const key="om_ids";
  const ids=JSON.parse(localStorage.getItem(key)||"[]");
  if(!ids.includes(msgId)){ids.unshift(msgId);localStorage.setItem(key,JSON.stringify(ids.slice(0,40)));}
}
$("cats").onclick=e=>{
  const b=e.target.closest("button");
  if(!b)return;
  cat=b.dataset.c;
  [...$("cats").children].forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
};
$("text").oninput=()=>$("cnt").textContent=$("text").value.length+" / 60";
async function measureRtt(){
  const samples=[];
  for(let i=0;i<6;i++){
    const t0=performance.now();
    try{
      await fetch("/api/range",{cache:"no-store"});
    }catch(e){
      return null;
    }
    samples.push(performance.now()-t0);
  }
  samples.sort((a,b)=>a-b);
  return samples[3];
}
async function submit(sos){
  const m=$("msg");
  const msgText=$("msgText");
  $("go").disabled=true;
  $("sos").disabled=true;
  m.dataset.state="sending";
  msgText.textContent=sos?"Connecting to help point, then sending SOS…":"Connecting to help point, then sending request…";
  const rtt=await measureRtt();
  try{
    const r=await fetch("/send",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        room:$("room").value.trim(),
        category:sos?"SOS":cat,
        sos:sos,
        text:sos?($("text").value||"SOS"):$("text").value,
        client_id:clientId(),
        rtt_ms:rtt
      })
    });
    let j={};
    try{j=await r.json();}catch(e){j={ok:false,error:"Relay returned an error (HTTP "+r.status+"). Is the radio plugged in?"};}
    if(j.ok){
      rememberId(j.id);
      m.dataset.state="success";
      msgText.textContent="Request sent. Opening your live status…";
      location.href=j.redirect||("/status/"+encodeURIComponent(j.id));
      return;
    }
    m.dataset.state="error";
    msgText.textContent=j.error||("Send failed (HTTP "+r.status+").");
  }catch(e){
    m.dataset.state="error";
    msgText.textContent="Could not reach the relay. Is sender_app running? On phone use this laptop's hotspot IP, not campus Wi-Fi.";
  }
  $("go").disabled=false;
  $("sos").disabled=false;
}
$("go").onclick=()=>submit(false);
$("sos").onclick=()=>submit(true);
</script>
</body>
</html>
