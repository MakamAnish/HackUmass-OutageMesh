<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help is coming</title>
<style>
:root{color-scheme:light;--bg:#edf3f8;--card:#fff;--ink:#15273d;--mute:#687b91;--line:#dce6ef;--accent:#2869d6;--ok:#16856c;--warn:#946315;--bad:#b3261e;--shadow:0 18px 50px rgba(31,67,105,.1)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101a27;--card:#1a2838;--ink:#eef5fc;--mute:#a9bacd;--line:#33475e;--accent:#86b4ff;--ok:#4dd0aa;--warn:#ffd166;--bad:#ff8585;--shadow:0 18px 50px rgba(0,0,0,.2)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--accent) 10%,var(--bg)),var(--bg) 62%);color:var(--ink);font:18px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:42rem;margin:0 auto;padding:clamp(1.5rem,6vh,3.5rem) 1.1rem;text-align:center}
.status-card{padding:clamp(1.4rem,5vw,2.5rem);border:1px solid var(--line);border-radius:1.5rem;background:var(--card);box-shadow:var(--shadow)}
.eyebrow{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.14em}
.icon{width:7rem;height:7rem;margin:1.1rem auto 1.3rem;border:4px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-size:3.2rem;color:var(--accent);animation:pulse 2s ease-out infinite}
h1{font-size:clamp(1.8rem,7vw,2.6rem);letter-spacing:-.04em;line-height:1.12;margin:.6rem 0}
.id,.sub{color:var(--mute)}
.sub{font-size:1rem;margin:.75rem 0 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin:2rem 0}
.step{border:1px solid var(--line);border-radius:.8rem;padding:.7rem .35rem;color:var(--mute);font-size:.82rem;font-weight:650;background:color-mix(in srgb,var(--bg) 65%,var(--card))}
.step.active{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:color-mix(in srgb,var(--ok) 11%,var(--card));color:var(--ok);font-weight:800}
#note{display:none;text-align:left;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 32%,var(--line));border-radius:1rem;padding:1rem 1.15rem;margin:1.5rem 0}
#note strong{display:block;color:var(--accent);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem}
#warning{display:none;color:var(--warn);font-weight:700;margin:1.2rem 0}
#sendError{display:none;color:var(--bad);font-weight:700;margin:1rem 0}
button,a{font:inherit}
button{padding:.75rem 1rem;border:1px solid var(--line);border-radius:.8rem;background:var(--card);color:var(--ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
nav{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1.6rem}
.nav-button{display:flex;align-items:center;justify-content:space-between;gap:.6rem;min-height:4rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:1rem;background:var(--card);color:var(--ink);font-size:.9rem;font-weight:750;text-align:left;text-decoration:none;box-shadow:0 5px 16px rgba(31,67,105,.06);transition:transform .15s ease,border-color .15s ease}
.nav-button:hover{transform:translateY(-2px);border-color:var(--accent)}
.nav-button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.nav-button small{display:block;margin-top:.15rem;font-size:.7rem;font-weight:500;opacity:.78}
.nav-icon{font-size:1.25rem;line-height:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 35%,transparent)}70%{box-shadow:0 0 0 1.2rem transparent}100%{box-shadow:0 0 0 0 transparent}}
@media(max-width:420px){nav{grid-template-columns:1fr}.steps{gap:.35rem}.step{font-size:.72rem}}
@media(prefers-reduced-motion:reduce){.icon,.nav-button{animation:none;transition:none}}
</style>
</head>
<body>
<main>
<div class="status-card">
  <div class="eyebrow">OUTAGE MESH · REQUEST STATUS</div>
  <div class="icon" aria-hidden="true">♥</div>
  <div class="id">Request <strong id="requestId"></strong></div>
  <h1 id="headline">Sending…</h1>
  <p class="sub">Keep this page open for updates from responders.</p>
  <div class="steps" aria-label="Request progress">
    <div class="step" id="stepSent">Sent</div>
    <div class="step" id="stepHeard">Heard</div>
    <div class="step" id="stepWay">On the way</div>
  </div>
  <div id="note"><strong>Responder note</strong><div id="noteText"></div></div>
  <div id="warning">Still trying. If you are in danger, move to the nearest Help Desk.</div>
  <div id="sendError"></div>
  <button id="retry" type="button" hidden>Retry sending</button>
  <nav aria-label="Request actions">
    <a class="nav-button primary" href="/"><span>Send another request<small>Start a new request</small></span><span class="nav-icon" aria-hidden="true">＋</span></a>
    <a class="nav-button" href="/requests"><span>My requests<small>View your request history</small></span><span class="nav-icon" aria-hidden="true">→</span></a>
  </nav>
</div>
</main>
<script>
const id={{ msg_id|tojson }};
document.getElementById("requestId").textContent=id;
function setStep(step,active){
  document.getElementById(step).classList.toggle("active",active);
}
function render(data){
  const state=data.state;
  const headlines={
    SENDING:"Sending…",
    SENT:"Request sent",
    HEARD:"Responders heard you",
    ON_WAY:"Help is on the way",
    DONE:"Help has arrived or request closed",
    FAILED:"Could not send."
  };
  document.getElementById("headline").textContent=
    data.send_state==="retrying"?"Could not send. Retrying…":(headlines[state]||"Sending…");
  setStep("stepSent",["SENT","HEARD","ON_WAY","DONE"].includes(state));
  setStep("stepHeard",["HEARD","ON_WAY","DONE"].includes(state));
  setStep("stepWay",["ON_WAY","DONE"].includes(state));
  const note=document.getElementById("note");
  note.style.display=data.note?"block":"none";
  document.getElementById("noteText").textContent=data.note||"";
  const sentAt=Date.parse(data.updated||"");
  document.getElementById("warning").style.display=
    !["HEARD","ON_WAY","DONE"].includes(state) && sentAt && Date.now()-sentAt>=90000
      ?"block":"none";
  const failed=state==="FAILED";
  const error=document.getElementById("sendError");
  error.textContent=failed?"Radio did not confirm after three attempts. Check the help point connection.":"";
  error.style.display=failed?"block":"none";
  document.getElementById("retry").hidden=!failed;
}
async function load(){
  try{
    const response=await fetch("/api/status/"+encodeURIComponent(id),{cache:"no-store"});
    if(response.ok) render(await response.json());
  }catch(e){}
  setTimeout(load,2000);
}
document.getElementById("retry").onclick=async()=>{
  const button=document.getElementById("retry");
  button.disabled=true;
  try{
    await fetch("/api/status/"+encodeURIComponent(id)+"/retry",{method:"POST"});
  }finally{
    button.disabled=false;
  }
};
load();
</script>
</body>
</html>
