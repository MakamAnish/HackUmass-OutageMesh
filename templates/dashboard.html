<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Responder dashboard</title>
<style>
:root{color-scheme:light;--bg:#eef2f6;--surface:#fff;--ink:#14243a;--mute:#66758a;--line:#dce4ed;--navy:#12243a;--blue:#2768d8;--teal:#13a58b;--high:#cf3f49;--med:#ce7925;--low:#25866d;--shadow:0 12px 30px rgba(24,43,69,.08)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111923;--surface:#192433;--ink:#edf4fc;--mute:#a3b2c4;--line:#2c3b4e;--navy:#0e1926;--blue:#78a9ff;--teal:#43c9aa;--high:#ff7d85;--med:#ffc078;--low:#57d2ad;--shadow:0 12px 30px rgba(0,0,0,.18)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;padding:1.1rem clamp(1rem,3vw,2.5rem);background:var(--navy);color:#fff}
.brand{display:flex;align-items:center;gap:.9rem}
.brand-mark{display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:.9rem;background:var(--teal);color:#fff;font-size:1.8rem;font-weight:800;line-height:1}
.eyebrow{color:#a6bad1;font-size:.68rem;font-weight:750;letter-spacing:.14em}
h1{font-size:1.35rem;letter-spacing:-.025em;margin:.05rem 0}
#stats{color:#c1cedc;font-size:.82rem}
.tools{display:flex;flex-wrap:wrap;gap:.55rem}
button{font:inherit;cursor:pointer;transition:transform .15s ease,filter .15s ease,border-color .15s ease}
.tools button,.floors button{border:1px solid #52647a;border-radius:.7rem;padding:.58rem .85rem;color:#eff5fc;background:#20354e;font-weight:650}
.tools button:hover,.floors button:hover,.act button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.tools #sim{background:var(--teal);border-color:var(--teal);color:#052d2a}
.tools #clr{background:transparent;color:#d4deea}
#sosBanner{padding:.8rem clamp(1rem,3vw,2.5rem);background:#c3323e;color:#fff;font-weight:750;letter-spacing:.01em}
.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.25rem;max-width:90rem;margin:0 auto;padding:1.4rem clamp(1rem,3vw,2.5rem)}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.map-panel{align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1rem;box-shadow:var(--shadow)}
.map-panel h2{font-size:1rem;letter-spacing:-.01em;margin:0 0 .6rem}
#mapLabel{color:var(--mute);font-size:.82rem;margin:0 0 .75rem;min-height:1.2em}
.map-wrap{position:relative;width:100%;background:#e8edf2;border:1px solid var(--line);border-radius:.75rem;overflow:hidden;aspect-ratio:1/1}
.map-wrap img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
#radar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.pin{position:absolute;transform:translate(-50%,-100%);width:1.65rem;height:1.65rem;border-radius:50% 50% 50% 0;rotate:-45deg;border:2px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.3);cursor:pointer;z-index:2}
.pin.active{outline:3px solid var(--ink);outline-offset:2px;z-index:3}
.pin .n{position:absolute;inset:0;display:grid;place-items:center;rotate:45deg;color:#fff;font:700 .7rem system-ui;pointer-events:none}
.floors{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 .7rem}
.floors button{background:transparent;color:var(--mute);border-color:var(--line);padding:.35rem .65rem;font-size:.8rem}
.floors button.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:750}
.sec{display:flex;align-items:center;gap:.5rem;color:var(--mute);font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;margin:1.15rem 0 .55rem;font-weight:800}
.sec:first-child{margin-top:.1rem}
.sec::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--mute)}
.sec.high::before{background:var(--high)}.sec.medium::before{background:var(--med)}.sec.low::before{background:var(--low)}
.m{display:grid;grid-template-columns:5.2rem minmax(0,1fr) minmax(10rem,12rem);gap:1rem;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:.95rem;padding:1rem;margin-bottom:.7rem;box-shadow:0 4px 14px rgba(24,43,69,.045);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.m:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.m.selected{outline:2px solid color-mix(in srgb,var(--blue) 65%,transparent);outline-offset:1px}
.m.resolved{opacity:.62}
.u{display:inline-flex;justify-content:center;align-items:center;min-height:2rem;border:1px solid color-mix(in srgb,var(--c) 38%,transparent);border-radius:99px;background:color-mix(in srgb,var(--c) 10%,var(--surface));font-weight:800;font-size:.78rem;color:var(--c);text-align:center;letter-spacing:.04em;padding:.35rem .55rem}
.t{font-size:1.04rem;line-height:1.4;font-weight:700;letter-spacing:-.015em;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:.78rem;margin-top:.4rem}
.act{display:flex;flex-direction:column;gap:.42rem;align-items:stretch;min-width:0}
.act input{font:inherit;font-size:.78rem;padding:.58rem .65rem;border:1px solid var(--line);border-radius:.65rem;background:var(--bg);color:var(--ink);width:100%}
.act input:focus{outline:2px solid var(--blue);outline-offset:1px}
.act button{font:inherit;font-size:.78rem;font-weight:750;padding:.52rem .65rem;border:1px solid var(--line);border-radius:.65rem;background:transparent;color:var(--ink)}
.act button.acknowledge{border-color:color-mix(in srgb,var(--blue) 35%,var(--line));background:color-mix(in srgb,var(--blue) 10%,var(--surface));color:var(--blue)}
.act button.on-way{border-color:color-mix(in srgb,var(--teal) 40%,var(--line));background:color-mix(in srgb,var(--teal) 11%,var(--surface));color:var(--teal)}
.act button.resolve{background:var(--navy);border-color:var(--navy);color:#fff}
.empty{color:var(--mute);padding:2rem;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:1rem}
@media(max-width:560px){header{align-items:flex-start}.tools{width:100%}.tools button{flex:1}.m{grid-template-columns:4.6rem minmax(0,1fr)}.act{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.act input{grid-column:1/-1}.act button{padding:.6rem .35rem;font-size:.74rem}}
@media(max-width:380px){.act{grid-template-columns:1fr}.act input{grid-column:auto}}
@keyframes flash{from{background:color-mix(in srgb,var(--c) 24%,var(--surface))}}
.m.fresh{animation:flash 1.5s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">+</span>
    <div>
    <div class="eyebrow">OUTAGE MESH · LIVE OPERATIONS</div>
    <h1>Responder dashboard</h1>
    <div id="stats"></div>
    </div>
  </div>
  <div class="tools">
    <button id="alarmBtn" type="button">Alarm on</button>
    <button id="sim" type="button">Simulate message</button>
    <button id="clr" type="button">Clear all</button>
  </div>
</header>
<div id="sosBanner" hidden>SOS — open emergency on the map</div>
<div class="layout">
  <section class="map-panel">
    <h2>Location map</h2>
    <div class="floors" id="floors"></div>
    <p id="mapLabel">Radar = estimated distance from the help-point Wio. Walls clip the sweep.</p>
    <div class="map-wrap" id="map">
      <img id="mapImg" alt="Floor plan" src="">
      <canvas id="radar"></canvas>
    </div>
  </section>
  <section id="list"><div class="empty">No messages yet. Waiting for the radio.</div></section>
</div>
<script>
const COL={HIGH:"var(--high)",MEDIUM:"var(--med)",LOW:"var(--low)"};
const COL_HEX={HIGH:"#b3261e",MEDIUM:"#d9622b",LOW:"#2f7d5b"};
const ORDER=["HIGH","MEDIUM","LOW"];
let seen=new Set(), first=true, selected=null, helpPoints=null, rowsCache=[];
const replyDrafts={};
let viewMap=null; // manual floor tab, or null = follow selected message

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function typingReply(){
  const a=document.activeElement;
  return !!(a && a.id && a.id.startsWith("reply-"));
}

function nodeFromMsg(r){
  const letter=(String(r.id||"").match(/^[A-Z]/i)||[])[0];
  if(letter && helpPoints?.nodes?.[letter.toUpperCase()]) return helpPoints.nodes[letter.toUpperCase()];
  const b=(r.building||"").toUpperCase();
  return Object.values(helpPoints?.nodes||{}).find(n=>n.building===b)||null;
}

/** Pin and radar center at the help-point Wio on this floor. */
function locate(r){
  const node=nodeFromMsg(r);
  const building=(r.building||node?.building||"CC").toUpperCase();
  const floor=String(r.floor||node?.floor||"1");
  const mapKey=building+"-"+floor;
  const map=helpPoints.maps?.[mapKey];
  const range=r.range_m!=null?Number(r.range_m):18;
  if(node && helpPoints.maps?.[node.map]){
    const nmap=helpPoints.maps[node.map];
    const where=node.label+(range?" · ~"+range.toFixed(0)+" m":"");
    return {mapKey:node.map, map:nmap, x:node.x, y:node.y, label:where, kind:"help", range};
  }
  if(map){
    return {mapKey, map, x:50, y:50, label:building+" floor "+floor+" · ~"+range.toFixed(0)+" m", kind:"floor", range};
  }
  return null;
}

function renderFloorTabs(){
  const box=document.getElementById("floors");
  box.replaceChildren();
  Object.keys(helpPoints.maps||{}).sort().forEach(key=>{
    const b=el("button","",helpPoints.maps[key].label.replace("Campus Center — ","")||key);
    if((viewMap||"")==key) b.classList.add("active");
    b.onclick=()=>{viewMap=key; const sel=rowsCache.find(r=>r.id===selected); if(sel) showMapFor(sel); else showMapKey(key); renderPins(rowsCache); renderFloorTabs();};
    box.append(b);
  });
  const auto=el("button","","Follow selected");
  if(!viewMap) auto.classList.add("active");
  auto.onclick=()=>{viewMap=null; const sel=rowsCache.find(r=>r.id===selected); if(sel) showMapFor(sel); renderPins(rowsCache); renderFloorTabs();};
  box.append(auto);
}

function showMapKey(mapKey, subtitle){
  const map=helpPoints.maps?.[mapKey];
  const img=document.getElementById("mapImg");
  const label=document.getElementById("mapLabel");
  if(!map){
    label.textContent="No floor map for "+mapKey;
    img.removeAttribute("src");
    return;
  }
  img.src="/static/floorplans/"+map.image;
  label.textContent=map.label+(subtitle?" · "+subtitle:"");
}

function showMapFor(r){
  const loc=locate(r);
  if(!loc||!loc.map){
    document.getElementById("mapLabel").textContent="No floor map configured yet.";
    return;
  }
  const mapKey=viewMap||loc.mapKey;
  const subtitle=viewMap && viewMap!==loc.mapKey
    ? ("viewing "+viewMap+"; pin is on "+loc.mapKey+" — "+loc.label)
    : loc.label;
  showMapKey(mapKey, subtitle);
}

function renderPins(rows){
  const wrap=document.getElementById("map");
  wrap.querySelectorAll(".pin").forEach(p=>p.remove());
  const open=rows.filter(r=>r.status!=="resolved");
  const activeMap=viewMap || (selected && locate(rows.find(r=>r.id===selected)||{})?.mapKey);
  const byPos={};
  open.forEach(r=>{
    const loc=locate(r);
    if(!loc||!loc.map)return;
    if(activeMap && loc.mapKey!==activeMap)return;
    const key=loc.mapKey+"|"+loc.x+"|"+loc.y;
    (byPos[key]=byPos[key]||{loc,msgs:[]}).msgs.push(r);
  });
  Object.values(byPos).forEach(({loc,msgs})=>{
    const top=msgs.sort((a,b)=>(ORDER.indexOf(a.level)-ORDER.indexOf(b.level)))[0];
    const pin=el("div","pin"+(selected && msgs.some(m=>m.id===selected)?" active":""));
    pin.style.left=loc.x+"%";
    pin.style.top=loc.y+"%";
    pin.style.background=COL_HEX[top.level]||COL_HEX.LOW;
    pin.title=loc.label+" · "+msgs.length+" open";
    pin.append(el("span","n",msgs.length>1?String(msgs.length):""));
    pin.onclick=e=>{e.stopPropagation();selected=top.id;viewMap=null;showMapFor(top);renderList(rowsCache);renderPins(rowsCache);renderFloorTabs();};
    wrap.append(pin);
  });
  updateRadar(open, activeMap);
}

const radarCanvas=document.getElementById("radar");
const mapImgEl=document.getElementById("mapImg");
const wallCache={};
let radarTargets=[];
let radarAngle=0;
let radarRaf=0;

function containRect(wrap, img){
  const wrapW=wrap.clientWidth, wrapH=wrap.clientHeight;
  const imgW=img.naturalWidth||1, imgH=img.naturalHeight||1;
  const s=Math.min(wrapW/imgW, wrapH/imgH);
  const w=imgW*s, h=imgH*s;
  return {x:(wrapW-w)/2, y:(wrapH-h)/2, w, h, imgW, imgH};
}

function classifyFloor(img){
  const key=img.src;
  if(wallCache[key]) return wallCache[key];
  const max=160;
  const w=max;
  const h=Math.max(1, Math.round(max*img.naturalHeight/img.naturalWidth));
  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(img,0,0,w,h);
  const data=g.getImageData(0,0,w,h).data;
  const cell=new Uint8Array(w*h); // 0 outside, 1 wall, 2 walk
  const luma=(i)=>0.2126*data[i]+0.7152*data[i+1]+0.0722*data[i+2];
  const WHITE=232, WALL=118;
  const q=[];
  const mark=(x,y)=>{
    const i=y*w+x;
    if(cell[i]) return;
    if(luma(i*4)<WHITE) return;
    cell[i]=9;
    q.push(x,y);
  };
  for(let x=0;x<w;x++){mark(x,0);mark(x,h-1);}
  for(let y=0;y<h;y++){mark(0,y);mark(w-1,y);}
  for(let n=0;n<q.length;){
    const x=q[n++], y=q[n++];
    if(x>0) mark(x-1,y);
    if(x+1<w) mark(x+1,y);
    if(y>0) mark(x,y-1);
    if(y+1<h) mark(x,y+1);
  }
  for(let i=0;i<cell.length;i++){
    if(cell[i]===9){cell[i]=0; continue;}
    cell[i]=luma(i*4)<WALL?1:2;
  }
  wallCache[key]={w,h,cell};
  return wallCache[key];
}

function reachableMask(grid, cxPct, cyPct, rangeM, widthM){
  const {w,h,cell}=grid;
  const sx=Math.max(0,Math.min(w-1,Math.round(cxPct/100*w)));
  const sy=Math.max(0,Math.min(h-1,Math.round(cyPct/100*h)));
  const mpp=widthM/w;
  const maxCells=Math.max(1, rangeM/mpp);
  const maxR2=maxCells*maxCells;
  const seen=new Uint8Array(w*h);
  const reach=new Uint8Array(w*h);
  if(cell[sy*w+sx]===1){
    // Wio sits on a drawn wall line — start from nearest walkable pixel.
    let found=false;
    for(let r=1;r<8 && !found;r++){
      for(let dy=-r;dy<=r && !found;dy++){
        for(let dx=-r;dx<=r && !found;dx++){
          const x=sx+dx, y=sy+dy;
          if(x<0||y<0||x>=w||y>=h) continue;
          if(cell[y*w+x]===2){ startFlood(x,y); found=true; }
        }
      }
    }
    if(!found) startFlood(sx,sy);
  }else startFlood(sx,sy);
  function startFlood(ox,oy){
    const q=[ox,oy];
    seen[oy*w+ox]=1;
    for(let n=0;n<q.length;){
      const x=q[n++], y=q[n++];
      const dx=x-sx, dy=y-sy;
      if(dx*dx+dy*dy>maxR2) continue;
      if(cell[y*w+x]===1) continue;
      reach[y*w+x]=1;
      const nbs=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
      for(const [nx,ny] of nbs){
        if(nx<0||ny<0||nx>=w||ny>=h) continue;
        const i=ny*w+nx;
        if(seen[i]||cell[i]===0||cell[i]===1) continue;
        seen[i]=1;
        q.push(nx,ny);
      }
    }
  }
  return {w,h,reach,sx,sy,maxCells};
}

function rayHit(grid, sx, sy, ang, maxCells){
  const {w,h,cell}=grid;
  const ca=Math.cos(ang), sa=Math.sin(ang);
  let x=sx+0.5, y=sy+0.5;
  for(let i=0;i<maxCells;i++){
    x+=ca; y+=sa;
    const ix=Math.round(x), iy=Math.round(y);
    if(ix<0||iy<0||ix>=w||iy>=h) return i;
    const c=cell[iy*w+ix];
    if(c===0||c===1) return i;
  }
  return maxCells;
}

function updateRadar(open, activeMap){
  radarTargets=[];
  (open||[]).forEach(r=>{
    const loc=locate(r);
    if(!loc||!loc.map) return;
    if(activeMap && loc.mapKey!==activeMap) return;
    radarTargets.push({
      loc,
      color:COL_HEX[r.level]||COL_HEX.LOW,
      range:loc.range||18,
      selected:r.id===selected
    });
  });
}

function drawRadar(){
  const wrap=document.getElementById("map");
  const img=mapImgEl;
  const cv=radarCanvas;
  if(!wrap||!img||!cv) return;
  const dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  if(cv.width!==W*dpr || cv.height!==H*dpr){
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+"px"; cv.style.height=H+"px";
  }
  const ctx=cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(!img.naturalWidth || !radarTargets.length) return;
  const box=containRect(wrap, img);
  let grid=null;
  try{ grid=classifyFloor(img); }catch(e){ grid=null; }
  radarTargets.forEach((t, idx)=>{
    const cx=box.x + t.loc.x/100*box.w;
    const cy=box.y + t.loc.y/100*box.h;
    const widthM=t.loc.map.width_m||90;
    const pxPerM=box.w/widthM;
    const rad=t.range*pxPerM;
    const color=t.color;
    let mask=null;
    if(grid){
      mask=reachableMask(grid, t.loc.x, t.loc.y, t.range, widthM);
      ctx.save();
      ctx.globalAlpha=t.selected?0.28:0.16;
      ctx.fillStyle=color;
      const cw=box.w/mask.w, ch=box.h/mask.h;
      for(let y=0;y<mask.h;y++){
        for(let x=0;x<mask.w;x++){
          if(!mask.reach[y*mask.w+x]) continue;
          ctx.fillRect(box.x+x*cw, box.y+y*ch, cw+0.5, ch+0.5);
        }
      }
      ctx.restore();
    }else{
      ctx.beginPath();
      ctx.arc(cx,cy,rad,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.globalAlpha=t.selected?0.18:0.1;
      ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.beginPath();
    ctx.arc(cx,cy,rad,0,Math.PI*2);
    ctx.strokeStyle=color;
    ctx.globalAlpha=0.7;
    ctx.setLineDash([6,5]);
    ctx.lineWidth=t.selected?2.2:1.4;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
    const ang=radarAngle + idx*0.9;
    let sweepLen=rad;
    if(grid && mask){
      const hit=rayHit(grid, mask.sx, mask.sy, ang, mask.maxCells);
      sweepLen=hit*(box.w/grid.w);
    }
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(ang)*sweepLen, cy+Math.sin(ang)*sweepLen);
    ctx.strokeStyle=color;
    ctx.lineWidth=2;
    ctx.globalAlpha=0.9;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx,cy,sweepLen,ang-0.45,ang);
    ctx.lineTo(cx,cy);
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.globalAlpha=0.2;
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.beginPath();
    ctx.arc(cx,cy,5,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
    ctx.strokeStyle="#fff";
    ctx.lineWidth=1.5;
    ctx.stroke();
  });
}

function radarLoop(ts){
  radarAngle=(ts/1800)%(Math.PI*2);
  drawRadar();
  radarRaf=requestAnimationFrame(radarLoop);
}
if(!radarRaf) radarRaf=requestAnimationFrame(radarLoop);
window.addEventListener("resize", drawRadar);

async function setStatus(id,status){
  const replyText=replyDrafts[id]||"";
  await fetch("/api/messages/"+encodeURIComponent(id)+"/status",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({status, reply_text: replyText})
  });
  delete replyDrafts[id];
  await load(true);
}

function makeCard(r){
  const level=r.level||"LOW";
  const loc=locate(r);
  const d=el("div","m"+(r.status==="resolved"?" resolved":"")+(r.id===selected?" selected":"")+((!first&&!seen.has(r.id))?" fresh":""));
  d.style.setProperty("--c",COL[level]||COL.LOW);
  d.onclick=()=>{selected=r.id;viewMap=null;showMapFor(r);renderList(rowsCache);renderPins(rowsCache);renderFloorTabs();};
  const u=el("div","u",level);
  const mid=el("div");
  mid.append(el("div","t",r.text||""));
  const when=r.received_at?new Date(r.received_at).toLocaleTimeString():"";
  const where=loc?loc.label:(r.zone||"unknown");
  const reasons=r.kw_reasons?(" · "+r.kw_reasons):"";
  mid.append(el("div","meta",r.id+" · "+where+" · "+(r.category||"")+" · "+when+(r.rssi!=null?" · "+r.rssi+" dBm":"")+" · "+(r.status||"new")+reasons));
  const a=el("div","act");
  a.onclick=e=>e.stopPropagation();
  if(r.status!=="resolved"){
    const inp=el("input");
    inp.type="text";
    inp.maxLength=50;
    inp.placeholder="Optional reply to sender";
    inp.id="reply-"+r.id;
    inp.value=replyDrafts[r.id]||"";
    inp.oninput=()=>{replyDrafts[r.id]=inp.value;};
    a.append(inp);
  }
  if(r.status!=="ack" && r.status!=="on_way" && r.status!=="resolved"){
    const b=el("button","","Acknowledge");
    b.classList.add("acknowledge");
    b.onclick=()=>setStatus(r.id,"ack");
    a.append(b);
  }else if(r.status==="ack"){
    a.append(el("div","meta","Acknowledged"));
  }else if(r.status==="on_way"){
    a.append(el("div","meta","On the way"));
  }
  if(r.status!=="on_way" && r.status!=="resolved"){
    const b=el("button","","On my way");
    b.classList.add("on-way");
    b.onclick=()=>setStatus(r.id,"on_way");
    a.append(b);
  }
  if(r.status!=="resolved"){
    const b=el("button","","Resolve");
    b.classList.add("resolve");
    b.onclick=()=>setStatus(r.id,"resolved");
    a.append(b);
  }
  d.append(u,mid,a);
  seen.add(r.id);
  return d;
}

function renderList(rows){
  const list=document.getElementById("list");
  const active=document.activeElement;
  const focusId=active && active.id && active.id.startsWith("reply-") ? active.id : null;
  const caret=focusId ? active.selectionStart : null;
  list.replaceChildren();
  const open=rows.filter(r=>r.status!=="resolved");
  const done=rows.filter(r=>r.status==="resolved");
  document.getElementById("stats").textContent=rows.length+" messages · "+open.length+" open · sorted HIGH → LOW";
  if(!rows.length){
    list.append(el("div","empty","No messages yet. Waiting for the radio."));
    return;
  }
  ORDER.forEach(level=>{
    const group=open.filter(r=>(r.level||"LOW")===level);
    if(!group.length)return;
    list.append(el("div","sec "+level.toLowerCase(),level+" priority ("+group.length+")"));
    group.forEach(r=>list.append(makeCard(r)));
  });
  if(done.length){
    list.append(el("div","sec resolved","Resolved ("+done.length+")"));
    done.forEach(r=>list.append(makeCard(r)));
  }
  if(focusId){
    const inp=document.getElementById(focusId);
    if(inp){
      inp.focus();
      try{inp.setSelectionRange(caret,caret);}catch(e){}
    }
  }
}

async function load(force){
  if(!force && typingReply()) return;
  if(!helpPoints){
    helpPoints=await (await fetch("/api/map")).json();
    renderFloorTabs();
  }
  const rows=await (await fetch("/api/messages")).json();
  rowsCache=rows;
  if(!selected && rows.length) selected=rows[0].id;
  const sel=rows.find(r=>r.id===selected)||rows[0];
  if(sel) showMapFor(sel);
  else if(viewMap) showMapKey(viewMap);
  renderList(rows);
  renderPins(rows);
  syncAlarm(rows);
  first=false;
}

let alarmMuted=false, audioCtx=null, alarmTimer=null, announced=new Set();
function stopAlarm(){
  if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null;}
  if(audioCtx){try{audioCtx.suspend();}catch(e){}}
}
function beep(){
  if(alarmMuted) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type="square";
    o.frequency.value=880;
    g.gain.value=0.08;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime+0.25);
  }catch(e){}
}
function speakSos(){
  if(alarmMuted || !window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance("SOS. Emergency help request.");
  u.rate=1;
  speechSynthesis.speak(u);
}
function syncAlarm(rows){
  const open=(rows||[]).filter(r=>(r.sos||r.category==="SOS") && r.status!=="resolved");
  const banner=document.getElementById("sosBanner");
  banner.hidden=!open.length;
  banner.textContent=open.length?("SOS — "+open.length+" open emergency request"+(open.length>1?"s":"")):"SOS";
  if(!open.length){stopAlarm();return;}
  open.forEach(r=>{
    if(!announced.has(r.id)){
      announced.add(r.id);
      speakSos();
    }
  });
  if(alarmMuted){stopAlarm();return;}
  if(!alarmTimer) alarmTimer=setInterval(beep, 700);
}
document.getElementById("alarmBtn").onclick=()=>{
  alarmMuted=!alarmMuted;
  document.getElementById("alarmBtn").textContent=alarmMuted?"Alarm off":"Alarm on";
  if(alarmMuted){stopAlarm(); if(window.speechSynthesis) speechSynthesis.cancel();}
  else syncAlarm(rowsCache);
};
document.getElementById("sim").onclick=async()=>{await fetch("/api/simulate",{method:"POST"});await load(true);};
document.getElementById("clr").onclick=async()=>{if(confirm("Delete all messages?")){await fetch("/api/clear",{method:"POST"});seen=new Set();first=true;selected=null;announced=new Set();stopAlarm();await load(true);}};
load(true);
setInterval(()=>load(false),2000);
</script>
