<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Responder dashboard</title>
<style>
:root{--bg:#f3f4f2;--card:#fff;--ink:#16191c;--mute:#5b6268;--line:#d5d8da;--high:#b3261e;--med:#d9622b;--low:#2f7d5b}
@media(prefers-color-scheme:dark){:root{--bg:#121416;--card:#1b1e21;--ink:#eceeef;--mute:#98a0a6;--line:#33383d;--high:#ff7b70;--med:#ff9a62;--low:#5fcf9a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,serif}
header{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line)}
h1{font-size:1.3rem;margin:0}
#stats{color:var(--mute)}
.tools button,.floors button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:.4rem;padding:.4rem .8rem;margin-left:.35rem;cursor:pointer}
.floors{margin:.5rem 0}
.floors button.active{border-color:var(--ink);font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem;max-width:72rem;margin:0 auto;padding:1rem 1.5rem}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.map-panel{background:var(--card);border:1px solid var(--line);border-radius:.4rem;padding:.75rem}
.map-panel h2{font-size:1rem;margin:0 0 .5rem}
#mapLabel{color:var(--mute);font-size:.85rem;margin:0 0 .5rem;min-height:1.2em}
.map-wrap{position:relative;width:100%;background:#ddd;border:1px solid var(--line);overflow:hidden;aspect-ratio:1/1}
.map-wrap img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.pin{position:absolute;transform:translate(-50%,-100%);width:1.6rem;height:1.6rem;border-radius:50% 50% 50% 0;rotate:-45deg;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer;z-index:2}
.pin.active{outline:3px solid var(--ink);outline-offset:2px;z-index:3}
.pin .n{position:absolute;inset:0;display:grid;place-items:center;rotate:45deg;color:#fff;font:700 .7rem system-ui;pointer-events:none}
.sec{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:1rem 0 .4rem;font-weight:700}
.sec:first-child{margin-top:0}
.m{display:grid;grid-template-columns:5.5rem 1fr auto;gap:1rem;align-items:start;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:.4rem;padding:.8rem 1rem;margin-bottom:.6rem;cursor:pointer}
.m.selected{box-shadow:inset 0 0 0 2px var(--ink)}
.m.resolved{opacity:.45}
.u{font-weight:800;font-size:1rem;color:var(--c);text-align:center;letter-spacing:.02em;padding-top:.2rem}
.t{font-size:1.1rem;font-weight:600}
.meta{color:var(--mute);font-size:.85rem}
.act{display:flex;flex-direction:column;gap:.35rem;align-items:stretch;min-width:9rem}
.act input{font:inherit;font-size:.8rem;padding:.3rem .4rem;border:1px solid var(--line);border-radius:.35rem;background:transparent;color:var(--ink);width:100%}
.act button{font:inherit;font-size:.85rem;padding:.35rem .6rem;border:1px solid var(--line);border-radius:.4rem;background:transparent;color:var(--ink);cursor:pointer}
.empty{color:var(--mute);padding:2rem;text-align:center}
@media(max-width:560px){.m{grid-template-columns:4.5rem 1fr}.act{grid-column:1/-1}}
@keyframes flash{from{background:color-mix(in srgb,var(--c) 30%,var(--card))}}
.m.fresh{animation:flash 1.5s}
</style>
</head>
<body>
<header>
  <div>
    <h1>Responder dashboard</h1>
    <div id="stats"></div>
  </div>
  <div class="tools">
    <button id="sim" type="button">Simulate message</button>
    <button id="clr" type="button">Clear all</button>
  </div>
</header>
<div class="layout">
  <section class="map-panel">
    <h2>Location map</h2>
    <div class="floors" id="floors"></div>
    <p id="mapLabel">Pin = help point (Wio), or the room the sender typed if provided.</p>
    <div class="map-wrap" id="map">
      <img id="mapImg" alt="Floor plan" src="">
    </div>
  </section>
  <section id="list"><div class="empty">No messages yet. Waiting for the radio.</div></section>
</div>
<script>
const COL={HIGH:"var(--high)",MEDIUM:"var(--med)",LOW:"var(--low)"};
const COL_HEX={HIGH:"#b3261e",MEDIUM:"#d9622b",LOW:"#2f7d5b"};
const ORDER=["HIGH","MEDIUM","LOW"];
let seen=new Set(), first=true, selected=null, helpPoints=null, rowsCache=[];
const replyDrafts={};
let viewMap=null; // manual floor tab, or null = follow selected message

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function typingReply(){
  const a=document.activeElement;
  return !!(a && a.id && a.id.startsWith("reply-"));
}

function nodeFromMsg(r){
  const letter=(String(r.id||"").match(/^[A-Z]/i)||[])[0];
  if(letter && helpPoints?.nodes?.[letter.toUpperCase()]) return helpPoints.nodes[letter.toUpperCase()];
  const b=(r.building||"").toUpperCase();
  return Object.values(helpPoints?.nodes||{}).find(n=>n.building===b)||null;
}

/** Resolve where to put the pin for a message. */
function locate(r){
  const node=nodeFromMsg(r);
  const building=(r.building||node?.building||"CC").toUpperCase();
  const floor=String(r.floor||node?.floor||"1");
  const room=(r.room||"").toUpperCase();
  const mapKey=building+"-"+floor;
  const map=helpPoints.maps?.[mapKey];
  if(room && map?.rooms?.[room]){
    const rm=map.rooms[room];
    return {mapKey, map, x:rm.x, y:rm.y, label:rm.label||room, kind:"room"};
  }
  if(node){
    const nmap=helpPoints.maps?.[node.map];
    return {mapKey:node.map, map:nmap, x:node.x, y:node.y, label:node.label, kind:"help"};
  }
  if(map){
    return {mapKey, map, x:50, y:50, label:building+" floor "+floor, kind:"floor"};
  }
  return null;
}

function renderFloorTabs(){
  const box=document.getElementById("floors");
  box.replaceChildren();
  Object.keys(helpPoints.maps||{}).sort().forEach(key=>{
    const b=el("button","",helpPoints.maps[key].label.replace("Campus Center — ","")||key);
    if((viewMap||"")==key) b.classList.add("active");
    b.onclick=()=>{viewMap=key; const sel=rowsCache.find(r=>r.id===selected); if(sel) showMapFor(sel); else showMapKey(key); renderPins(rowsCache); renderFloorTabs();};
    box.append(b);
  });
  const auto=el("button","","Follow selected");
  if(!viewMap) auto.classList.add("active");
  auto.onclick=()=>{viewMap=null; const sel=rowsCache.find(r=>r.id===selected); if(sel) showMapFor(sel); renderPins(rowsCache); renderFloorTabs();};
  box.append(auto);
}

function showMapKey(mapKey, subtitle){
  const map=helpPoints.maps?.[mapKey];
  const img=document.getElementById("mapImg");
  const label=document.getElementById("mapLabel");
  if(!map){
    label.textContent="No floor map for "+mapKey;
    img.removeAttribute("src");
    return;
  }
  img.src="/static/floorplans/"+map.image;
  label.textContent=map.label+(subtitle?" · "+subtitle:"");
}

function showMapFor(r){
  const loc=locate(r);
  if(!loc||!loc.map){
    document.getElementById("mapLabel").textContent="No floor map configured yet.";
    return;
  }
  const mapKey=viewMap||loc.mapKey;
  const subtitle=viewMap && viewMap!==loc.mapKey
    ? ("viewing "+viewMap+"; pin is on "+loc.mapKey+" — "+loc.label)
    : loc.label;
  showMapKey(mapKey, subtitle);
}

function renderPins(rows){
  const wrap=document.getElementById("map");
  wrap.querySelectorAll(".pin").forEach(p=>p.remove());
  const open=rows.filter(r=>r.status!=="resolved");
  const activeMap=viewMap || (selected && locate(rows.find(r=>r.id===selected)||{})?.mapKey);
  const byPos={};
  open.forEach(r=>{
    const loc=locate(r);
    if(!loc||!loc.map)return;
    if(activeMap && loc.mapKey!==activeMap)return;
    const key=loc.mapKey+"|"+loc.x+"|"+loc.y;
    (byPos[key]=byPos[key]||{loc,msgs:[]}).msgs.push(r);
  });
  Object.values(byPos).forEach(({loc,msgs})=>{
    const top=msgs.sort((a,b)=>(ORDER.indexOf(a.level)-ORDER.indexOf(b.level)))[0];
    const pin=el("div","pin"+(selected && msgs.some(m=>m.id===selected)?" active":""));
    pin.style.left=loc.x+"%";
    pin.style.top=loc.y+"%";
    pin.style.background=COL_HEX[top.level]||COL_HEX.LOW;
    pin.title=loc.label+" · "+msgs.length+" open";
    pin.append(el("span","n",msgs.length>1?String(msgs.length):""));
    pin.onclick=e=>{e.stopPropagation();selected=top.id;viewMap=null;showMapFor(top);renderList(rowsCache);renderPins(rowsCache);renderFloorTabs();};
    wrap.append(pin);
  });
}

async function setStatus(id,status){
  const replyText=replyDrafts[id]||"";
  await fetch("/api/messages/"+encodeURIComponent(id)+"/status",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({status, reply_text: replyText})
  });
  delete replyDrafts[id];
  await load(true);
}

function makeCard(r){
  const level=r.level||"LOW";
  const loc=locate(r);
  const d=el("div","m"+(r.status==="resolved"?" resolved":"")+(r.id===selected?" selected":"")+((!first&&!seen.has(r.id))?" fresh":""));
  d.style.setProperty("--c",COL[level]||COL.LOW);
  d.onclick=()=>{selected=r.id;viewMap=null;showMapFor(r);renderList(rowsCache);renderPins(rowsCache);renderFloorTabs();};
  const u=el("div","u",level);
  const mid=el("div");
  mid.append(el("div","t",r.text||""));
  const when=r.received_at?new Date(r.received_at).toLocaleTimeString():"";
  const where=loc?loc.label:(r.zone||"unknown");
  const reasons=r.kw_reasons?(" · "+r.kw_reasons):"";
  mid.append(el("div","meta",r.id+" · "+where+" · "+(r.category||"")+" · "+when+(r.rssi!=null?" · "+r.rssi+" dBm":"")+" · "+(r.status||"new")+reasons));
  const a=el("div","act");
  a.onclick=e=>e.stopPropagation();
  if(r.status!=="resolved"){
    const inp=el("input");
    inp.type="text";
    inp.maxLength=40;
    inp.placeholder="Optional reply to sender";
    inp.id="reply-"+r.id;
    inp.value=replyDrafts[r.id]||"";
    inp.oninput=()=>{replyDrafts[r.id]=inp.value;};
    a.append(inp);
  }
  if(r.status!=="ack" && r.status!=="resolved"){
    const b=el("button","","Acknowledge");
    b.onclick=()=>setStatus(r.id,"ack");
    a.append(b);
  }else if(r.status==="ack"){
    a.append(el("div","meta","Acknowledged"));
  }
  if(r.status!=="resolved"){
    const b=el("button","","Resolve");
    b.onclick=()=>setStatus(r.id,"resolved");
    a.append(b);
  }
  d.append(u,mid,a);
  seen.add(r.id);
  return d;
}

function renderList(rows){
  const list=document.getElementById("list");
  const active=document.activeElement;
  const focusId=active && active.id && active.id.startsWith("reply-") ? active.id : null;
  const caret=focusId ? active.selectionStart : null;
  list.replaceChildren();
  const open=rows.filter(r=>r.status!=="resolved");
  const done=rows.filter(r=>r.status==="resolved");
  document.getElementById("stats").textContent=rows.length+" messages · "+open.length+" open · sorted HIGH → LOW";
  if(!rows.length){
    list.append(el("div","empty","No messages yet. Waiting for the radio."));
    return;
  }
  ORDER.forEach(level=>{
    const group=open.filter(r=>(r.level||"LOW")===level);
    if(!group.length)return;
    list.append(el("div","sec",level+" priority ("+group.length+")"));
    group.forEach(r=>list.append(makeCard(r)));
  });
  if(done.length){
    list.append(el("div","sec","Resolved ("+done.length+")"));
    done.forEach(r=>list.append(makeCard(r)));
  }
  if(focusId){
    const inp=document.getElementById(focusId);
    if(inp){
      inp.focus();
      try{inp.setSelectionRange(caret,caret);}catch(e){}
    }
  }
}

async function load(force){
  if(!force && typingReply()) return;
  if(!helpPoints){
    helpPoints=await (await fetch("/api/map")).json();
    renderFloorTabs();
  }
  const rows=await (await fetch("/api/messages")).json();
  rowsCache=rows;
  if(!selected && rows.length) selected=rows[0].id;
  const sel=rows.find(r=>r.id===selected)||rows[0];
  if(sel) showMapFor(sel);
  else if(viewMap) showMapKey(viewMap);
  renderList(rows);
  renderPins(rows);
  first=false;
}

document.getElementById("sim").onclick=async()=>{await fetch("/api/simulate",{method:"POST"});await load(true);};
document.getElementById("clr").onclick=async()=>{if(confirm("Delete all messages?")){await fetch("/api/clear",{method:"POST"});seen=new Set();first=true;selected=null;await load(true);}};
load(true);
setInterval(()=>load(false),2000);
</script>
</body>
</html>
